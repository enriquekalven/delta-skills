# BMAD Module Manifest for Google Cloud Delta Squad Suite
code: bmad-module-gcp-delta
name: Google Cloud Delta Squad Enterprise Suite
version: 1.1.0
type: module
marketplace-plugin: true
description: Enterprise Google Cloud AI Agent architecture advisory, multi-model ZDR cost routing, SME baseline KPI auditing, and TDL field execution playbooks.
author: Enrique Chan <https://github.com/enriquekalven>
license: Apache-2.0

# Integration with BMAD Method Delivery Loop
bmad_method:
  min_version: "6.0.0"
  phase_extensions:
    analysis:
      - synthetic-baseline-protocol
      - codebase-onboarding-and-mapping
    planning:
      - gcp-agent-architecture-advisor
      - tdl-field-guide
    build:
      - e2e-delivery-workflow
      - claude-review
      - claude-agent-harness
      - ecc-repo-conventions
      - agentic-engineering
    learn:
      - skill-stocktake

workflows:
  - name: delta-bmad-workflow
    path: skills/delta-bmad-workflow
    command: /delta-bmad-workflow
    description: Master Spec-Driven Development (SDD) bridge mapping BMAD 8-step daisy-chain to GCP TDL enterprise field playbooks.

skills:
  - name: delta-bmad-workflow
    path: skills/delta-bmad-workflow
    description: Master workflow bridge mapping BMAD 4-phase agile delivery to GCP TDL field playbooks.
  - name: gcp-agent-architecture-advisor
    path: skills/gcp-agent-architecture-advisor
    description: Google Cloud AI Agent architecture evaluation (No-Code, Low-Code, High-Code ADK).
  - name: synthetic-baseline-protocol
    path: skills/synthetic-baseline-protocol
    description: Pre-deployment 50-sample retrospective SME ticket audit for baseline ROI benchmarking.
  - name: claude-review
    path: skills/claude-review
    description: Two-pass coding (Gemini Flash) and peer review via Vertex AI Model Garden Opus 5 ZDR.
  - name: claude-agent-harness
    path: skills/claude-agent-harness
    description: Spec-to-code delegation to Vertex AI Model Garden Opus 5 ZDR endpoint.
  - name: tdl-field-guide
    path: skills/tdl-field-guide
    description: 12-week operational field playbook for Technical Deployment Leads.
  - name: e2e-delivery-workflow
    path: skills/e2e-delivery-workflow
    description: 7-phase software engineering lifecycle with capability slot auditing.
  - name: codebase-onboarding-and-mapping
    path: skills/codebase-onboarding-and-mapping
    description: Repository component dependency mapping and docs/ONBOARDING.md generation.
  - name: ecc-repo-conventions
    path: skills/ecc-repo-conventions
    description: Enforces standardized repo structure, STATE.md, and environment hygiene.
  - name: agentic-engineering
    path: skills/agentic-engineering
    description: Governs subagent task decomposition, multi-model cost routing, and fleet management.
  - name: skill-stocktake
    path: skills/skill-stocktake
    description: Audits workspace capability slots before phase transitions.
