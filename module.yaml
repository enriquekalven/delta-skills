# BMAD Module Manifest for Google Cloud Delta Squad Suite
code: bmad-module-gcp-delta
name: Google Cloud Delta Squad Enterprise Suite
version: 3.1.0
type: module
marketplace-plugin: true
description: Delta Suite v3.1: 4-Phase Customer Engagement Lifecycle Suite (delta-discover, delta-plan, delta-build, delta-harden, delta-orchestrator) + Multi-Model ZDR Skills (claude-review, claude-agent-harness). Features customer intake interviews, GCP 3-tier architecture advisory, 2-role squad matrix, FastMCP building, Playwright UI testing, plain-English anti-slop auditing, and Model Garden Opus 5 ZDR peer review.
author: Enrique Chan <https://github.com/enriquekalven>
license: Apache-2.0

# Integration with BMAD Method Delivery Loop
bmad_method:
  min_version: "6.0.0"
  phase_extensions:
    analysis:
      - delta-discover
    planning:
      - delta-plan
    build:
      - delta-build
      - claude-agent-harness
    learn:
      - delta-harden
      - claude-review

workflows:
  - name: delta-orchestrator
    path: skills/delta-orchestrator
    command: /delta-orchestrator
    description: Master Router & Phase-Gate Lifecycle Orchestrator across 4 natural engagement stages.

skills:
  - name: delta-orchestrator
    path: skills/delta-orchestrator
    description: Master Router & Phase-Gate Lifecycle Orchestrator across 4 natural engagement stages.
  - name: delta-discover
    path: skills/delta-discover
    description: Phase 1: Customer Intake Interviews, Repo Onboarding (ONBOARDING.md), and 50 SME Ticket Baseline Audit (baseline_kpis.json).
  - name: delta-plan
    path: skills/delta-plan
    description: Phase 2: GCP Architecture Workshop, Abstraction Selection Matrix, Threat Modeling (THREAT_MODEL.md), and 2-Role Squad Pair.
  - name: delta-build
    path: skills/delta-build
    description: Phase 3: Production TDD Build, prd.json Task Loops, FastMCP Server Integration, Playwright UI Testing, and Secret Scanning.
  - name: delta-harden
    path: skills/delta-harden
    description: Phase 4: Hardening & Launch, Plain-English Anti-Slop Audit (rm-slop), Vertex AI Model Garden Opus 5 ZDR Review, and ROI Savings Report.
  - name: claude-review
    path: skills/claude-review
    description: Two-Pass Execution & Review Loop: Generates baseline code with Gemini 3.6 Flash, reviews with Opus 5 via Model Garden API, and applies revisions.
  - name: claude-agent-harness
    path: skills/claude-agent-harness
    description: Direct High-Tier Delegation: Translates specs, PRDs, or natural language prompts directly into production code files via Model Garden API script.
